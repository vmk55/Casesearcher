name: Оновлення бази справ Київводоканалу

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Запустити скрипт
        run: python fetch_cases.py
        env:
          EDRSR_ZIP_URL: ${{ secrets.EDRSR_ZIP_URL }}
        continue-on-error: true

      - name: Зберегти лог і результат у репозиторій
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cases.json log.txt || true
          git diff --staged --quiet || git commit -m "Оновлення бази справ"
          git push
