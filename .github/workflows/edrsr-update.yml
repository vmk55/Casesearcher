name: Оновлення бази справ Київводоканалу

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Підготовка
        run: |
          echo "Запуск: $(date)" > log.txt
          python3 --version >> log.txt 2>&1
          pip3 install requests >> log.txt 2>&1

      - name: Запустити скрипт
        run: python3 fetch_cases.py >> log.txt 2>&1
        continue-on-error: true
        env:
          EDRSR_ZIP_URL: ${{ secrets.EDRSR_ZIP_URL }}

      - name: Зберегти лог і результат
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cases.json 2>>log.txt || true
          git add log.txt
          git commit -m "log $(date +%s)" || echo "nothing to commit"
          git push || echo "push failed"
