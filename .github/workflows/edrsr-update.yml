name: Оновлення бази справ Київводоканалу

on:
  schedule:
    - cron: "0 4 * * *"   # щодня о 04:00 UTC (06:00/07:00 за Києвом)
  workflow_dispatch: {}    # можливість запустити вручну кнопкою в GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch_cases.py
        env:
          EDRSR_ZIP_URL: ${{ secrets.EDRSR_ZIP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RAW_DEBUG: "1"   # прибрати після першого успішного калібрування
